name: Build What Remains (macOS DMG)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ✅ FIXED: match YOUR spec path exactly
      - name: Create required backend files
        run: |
          mkdir -p the-app/src/the-app-name/backend
          touch the-app/src/the-app-name/backend/game.db
          touch the-app/src/the-app-name/backend/keybinds.json

      - name: Build with PyInstaller spec
        run: |
          pyinstaller WhatRemains-mac.spec

      # 🔥 FIXED: robust DMG step (no wrong assumptions)
      - name: Create DMG
        run: |
          APP_NAME="WhatRemains"

          mkdir -p dmg

          # PyInstaller macOS output handling (correct + stable)
          if [ -d "dist/WhatRemains.app" ]; then
            cp -R "dist/WhatRemains.app" dmg/
          elif [ -d "dist/WhatRemains" ]; then
            cp -R "dist/WhatRemains" dmg/
          else
            echo "❌ Build failed: no output found in dist/"
            ls -R dist
            exit 1
          fi

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder dmg \
            -ov -format UDZO \
            "WhatRemains-mac.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatRemains-mac-dmg
          path: WhatRemains-mac.dmg
