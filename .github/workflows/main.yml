name: Build What Remains (macOS DMG)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 🔥 THIS IS THE FIX
      - name: Create missing backend files
        run: |
          mkdir -p backend
          touch backend/game.db

      - name: Build with PyInstaller spec
        run: |
          pyinstaller WhatRemains-mac.spec

      - name: Create DMG
        run: |
          APP_NAME="What Remains"

          mkdir -p dmg
          cp -R "dist/WhatRemains.app" dmg/

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder dmg \
            -ov -format UDZO \
            "WhatRemains-mac.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: WhatRemains-mac-dmg
          path: WhatRemains-mac.dmg
